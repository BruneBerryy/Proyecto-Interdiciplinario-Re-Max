# Nombre de la aplicación (opcional)
spring.application.name=remax-backend

# ----------------------------------------------------
# 1. Configuración de Conexión a MySQL (XAMPP por defecto)
# ----------------------------------------------------

# URL de la base de datos: USAR remax_db
spring.datasource.url=jdbc:mysql://localhost:3306/remax_db?useSSL=false&serverTimezone=UTC

# Usuario por defecto de XAMPP
spring.datasource.username=root

# Contraseña: DEBE ESTAR VACÍA si usas XAMPP por defecto, ya que la contraseña 'Thiago123#'
# fue la que causó el error "Access denied for user 'root'@'localhost' (using password: YES)".
spring.datasource.password=

# Driver de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------------------------------------------
# 2. Configuración de JPA/Hibernate
# ----------------------------------------------------

# DDL Auto: USAR 'none' o 'update'

# Usamos 'none' para asegurar que Hibernate no intente modificar tablas que ya definimos
# manualmente o con Stored Procedures, evitando errores de permisos o estructura.
# Si quieres que actualice las entidades (Models), usa 'update'.
spring.jpa.hibernate.ddl-auto=none

# Muestra el SQL generado en la consola (útil para debug)
spring.jpa.show-sql=true

# Especifica el dialecto (advertencia de la consola de Spring)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect